# DigiTech Whammy IV mount, based on the supplied bracket specification and
# the lower-right Cinque 5.4 slot pattern in reference/Cinque_54.jpg.

id: digitech_whammy_iv
output_dir: "DigiTech Whammy IV"
name: "DigiTech Whammy IV mount (plate layout draft)"
enclosure: "DigiTech Whammy IV"
board: cinque_5_4
status: draft
source: "reference/DigiTech/digitech_whammy_iv_cad_bracket_specifications.md"
board_placement:
  region: right_of_brown_octave
  # In the placement photo +X points right along the board and +Y points down.
  plate_center_mm: [385.0, 96.5]
  alignment:
    right_edge: "aligned with the right edge of the Boss TU-3 tuner"
    velcro: "both transverse strips cross the pedal footprint"
  source: "reference/Cinque Captures/whammy_spot.jpg"
  confidence: photo_and_slot_drawing_estimate
pedal_modifications:
  # Foot centres are estimated 15 mm from the edges; screw centres are 8 mm
  # from the edges, so their centres are only about 10 mm apart diagonally.
  - "Remove the four stock rubber feet to expose the corner baseplate screws."
provenance:
  outline: {level: 3, source: "supplied CAD bracket specification"}
  mount_holes: {level: 3, source: "supplied CAD bracket specification"}

plate:
  thickness_mm: 4.0

spines:
  # Four clips align with openings visible under the intended pedal footprint.
  # The slot-center positions are photo/drawing estimates pending test-fit.
  - name: upper_spine
    clips: 2
    post_spacing_mm: 76.2
    axis: y
    clip_width_mm: 17.7
    arch_scale: 1.0
    flare: outward
    clearance_mm: 2.0
    offset_mm: -48.5
  - name: lower_edge_spine
    clips: 2
    post_spacing_mm: 76.2
    axis: y
    clip_width_mm: 17.7
    arch_scale: 1.0
    flare: outward
    clearance_mm: 2.0
    offset_mm: 48.5

wings:
  - name: pedal_plate
    width_mm: 200.0
    depth_mm: 203.2
    corner_radius_mm: 6.35

mount_holes:
  - {x: -92.0, y: -93.6, bore_mm: 3.8, csk_dia_mm: null}
  - {x: 92.0, y: -93.6, bore_mm: 3.8, csk_dia_mm: null}
  - {x: -92.0, y: 93.6, bore_mm: 3.8, csk_dia_mm: null}
  - {x: 92.0, y: 93.6, bore_mm: 3.8, csk_dia_mm: null}

fasteners:
  thread: "#6-32 UNC"
  nominal_major_diameter_mm: 3.5
  under_head_length_options_mm: [6.35, 12.7]
  head_types: ["Phillips pan-head", "button-head", "round-head"]
  countersunk: false
  note: "Select screw length to suit the pedal's threaded baseplate and the 4 mm mount plate."

brand_stamp:
  model_number: "DTW IV"
  cx: 0.0
  cy: 0.0
  font: Lacquer
  font_path: ../../assets/fonts/Lacquer-Regular.ttf
  bold_amount_mm: 0.2
  font_size_mm: 9.5
  line_spacing_mm: 11.0
  model_gap_mm: 12.0
  depth_mm: 0.4
  frame_padding_mm: 2.5
  frame_width_mm: 0.8
  frame_radius_mm: 2.0
  # Upright in the board photo when viewed with the pedal removed.
  rotation_deg: 180.0

open_questions:
  - "The four clip positions are aligned to visible slots in the placement photo and layout drawing; verify engagement and clearance on the actual Cinque 5.4 before printing."
  - "Confirm which supplied screw length (1/4 in or 1/2 in) provides adequate thread engagement without bottoming out."
