# 125B mount - component description, measured from the OEM part
#
# Source: reference/Wampler/Wampler-125B.stl, sectioned with tools/stl_profile.py
# and tools/stl_section.py. Every number below comes from that mesh.
#
# Structure: one spine (two clips strung across the board slots) plus a wing that
# carries the pedal's four baseplate screws. The spine axis is X, i.e.
# perpendicular to the RockBoard slots, so the two clips drop into two slot rows.

id: 125b_quickmount
name: "125B single-piece mount (two clips, four screws)"
housing: 125b_vertical
board: cinque_5_2
status: measured
source: "reference/Wampler/Wampler-125B.stl"
# the clip cross-section measured from this very part, not the generic 2-space clip
clip: catalog/clips/wampler_125b_clip.yaml
provenance:
  outline: {level: 4, source: "mesh bounds"}
  spine: {level: 4, source: "mesh sections at y = 4..18"}
  mount_holes: {level: 4, source: "mesh vertex rings on the hole walls"}

plate:
  thickness_mm: 3.0
  # The separate 3-4 mm adhesive mat sits board-side, between plate and board.

spines:
  - name: spine_a
    clips: 2
    # post faces measure x = -38.1 and +38.1, so the posts are 76.2 apart
    post_spacing_mm: 76.2
    axis: x
    clip_width_mm: 22.0
    # the OEM clip measures 19.3 mm outboard of its post face at scale 1.0
    arch_scale: 1.0
    flare: outward
    clearance_mm: 2.0
    # OEM flex notches are 24 mm wide with 6 mm inner corner radii.
    clearance_width_mm: 2.0
    clearance_radius_mm: 6.0
    # clips sit at z 0..22 in the OEM, i.e. centred 11 mm above the plate centre
    offset_mm: 11.0

wings:
  - name: pedal_plate
    # The plate is the wing that reaches all four screws; the spine sits inside it.
    width_mm: 120.0
    depth_mm: 65.0
    corner_radius_mm: 3.0
    cx: 0.0
    cy: 11.0

mount_holes:
  - {x: -55.6, y: -17.6, bore_mm: 3.7, csk_dia_mm: 6.7, csk_face: top}
  - {x: 55.6, y: -17.6, bore_mm: 3.7, csk_dia_mm: 6.7, csk_face: top}
  - {x: -55.6, y: 39.6, bore_mm: 3.7, csk_dia_mm: 6.7, csk_face: top}
  - {x: 55.6, y: 39.6, bore_mm: 3.7, csk_dia_mm: 6.7, csk_face: top}

brand_stamp:
  model_number: "125B"
  # Center of the plate's flat pedal-facing surface.
  cx: 0.0
  cy: 11.0
  font: Lacquer
  # Relative to this YAML file, keeping the generated outlines reproducible.
  font_path: ../../assets/fonts/Lacquer-Regular.ttf
  # Lacquer only provides a regular face; expand its vector outlines by 0.2 mm.
  bold_amount_mm: 0.2
  # "Melting" spans 32.5 mm, the middle half of the 65 mm short edge.
  font_size_mm: 9.5
  line_spacing_mm: 11.0
  # Extra blank distance between the second company line and the model number.
  model_gap_mm: 12.0
  # Leaves 2.6 mm of the plate; the stamp is opposite the board-side foam mat.
  depth_mm: 0.4
  # Rounded frames enclose both company lines together and the model separately.
  frame_padding_mm: 2.5
  frame_width_mm: 0.8
  frame_radius_mm: 2.0
  # The text baseline follows the plate's 65 mm short edge.
  rotation_deg: 90.0

open_questions:
  - "Clip width measures 22.0 mm across, but catalog/boards/cinque_5_2.yaml has a provisional slot width of 17.7 mm. The clip cannot fit a 17.7 mm slot, so one of the two is wrong."
  - "Post faces are 76.2 mm apart, against a provisional board pitch of 34.25 mm."
