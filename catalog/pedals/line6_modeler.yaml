# Line 6 modeler series (DL4 / FM4 / MM4 / DM4 / AM4) - component description
#
# Source: reference/Line 6 Modelers/line_6_modeler_cad_bracket_specifications.md
# (supplied spec sheet, imperial 10 x 6 in chassis).
#
# The pedal footprint stays in the source-spec orientation. Its board attachment
# uses two spines across the longitudinal slot rows, each with two clips. This
# rotates the clip layout relative to the pedal, not the pedal and clips together.
# The chassis has a bottom battery door, so the wing needs a through pocket.

id: line6_modeler
name: "Line 6 modeler mount (transverse clips, two spines, four screws)"
enclosure: "Line 6 DL4/FM4/MM4/DM4/AM4"
board: cinque_5_2
status: spec
source: "reference/Line 6 Modelers/line_6_modeler_cad_bracket_specifications.md"
provenance:
  outline: {level: 3, source: "spec sheet, 254 x 152 mm, R9.5 corners"}
  mount_holes: {level: 3, source: "spec sheet, 238 x 136 mm hole centres"}
  battery_door: {level: 3, source: "spec sheet, 164 x 62 mm"}
  spine: {level: 2, source: "chosen here, not supplied by the spec"}

plate:
  # spec sheet: 3.5-5.0 mm for PETG, 100 % infill around the bosses
  thickness_mm: 4.0

spines:
  - name: spine_front
    clips: 2
    post_spacing_mm: 76.2
    axis: y
    clip_width_mm: 22.0
    arch_scale: 1.0
    flare: outward
    clearance_mm: 2.0
    # X follows the board's longitudinal slots. Clip rows at y = +-38.1 clear
    # the battery-door relief at y = +-31; spine positions remain x = +-45.
    offset_mm: -45.0
  - name: spine_back
    clips: 2
    post_spacing_mm: 76.2
    axis: y
    clip_width_mm: 22.0
    arch_scale: 1.0
    flare: outward
    clearance_mm: 2.0
    offset_mm: 45.0

wings:
  - name: chassis_plate
    width_mm: 254.0
    depth_mm: 152.0
    corner_radius_mm: 9.5
    pockets:
      # bottom-accessible C-cell battery door. The sheet says "centred
      # horizontally, slightly toward the front edge"; the offset is not given,
      # so it is placed on centre and flagged below.
      - name: battery_door
        cx: 0.0
        cy: 0.0
        width_mm: 164.0
        depth_mm: 62.0
        through: true

mount_holes:
  # M3 x 0.5, 90 degree countersunk head, countersink opens on the board face
  - {x: -119.0, y: -68.0, bore_mm: 3.5, csk_dia_mm: 6.2, csk_face: top}
  - {x: 119.0, y: -68.0, bore_mm: 3.5, csk_dia_mm: 6.2, csk_face: top}
  - {x: -119.0, y: 68.0, bore_mm: 3.5, csk_dia_mm: 6.2, csk_face: top}
  - {x: 119.0, y: 68.0, bore_mm: 3.5, csk_dia_mm: 6.2, csk_face: top}

open_questions:
  - "Battery door offset toward the front edge is not quantified in the spec; drawn on centre. Measure the door on a real chassis before printing."
  - "The 76.2 mm post spacing is copied from the 125B, and the +/-45 mm spine positions are chosen; neither is verified against the Cinque 5.2 slot-centre matrix."
  - "Spec sheet allows 3.5-5.0 mm plate thickness; 4.0 mm chosen, but the clip bar is 3.0 mm, so the plate is thicker than the spine it carries."
