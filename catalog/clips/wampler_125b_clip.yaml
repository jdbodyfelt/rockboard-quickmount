# Measured cross-section of the clip in the OEM 125B QuickMount plate
#
# Source: reference/Wampler/Wampler-125B.stl, taken from the part's end cap
# (faces at z = 0, normal -Z) and rebased so the post's outer face sits at u = 0.
#
# This is a different clip from catalog/clips/reference_2space_clip.yaml: same
# mechanism (post, arch, skirt), different arch shape and a 19.3 mm reach instead
# of 16.8 mm. Used for mounts that reproduce the OEM 125B plate.
#
# Coordinates:
#   u <= 0   outboard of the post face; the arch and skirt live here
#   z = 0    plate underside (pedal face), clip rises to z = 19.65

id: wampler_125b_clip
source: "reference/Wampler/Wampler-125B.stl"
licence: "reference mesh, measurements only"
measured: 2026-11-02
extrude_y_mm: 22.0
bar_underside_z: 0.0
# explicit post faces: the derived-from-verticals path expects a bar in the
# profile, and this profile is the clip on its own
post_inner_x: 0.0
post_outer_x: -2.5
arch_span_mm: 14.3
arch_base_depth_mm: 10.0
