# RockBoard Cinque 5.2
#
# Envelope: Official RockBoard catalogue (5.2 = 622 x 424 mm, 3.95 kg).
#
# Slot grid - measured by the user on the board, powder coat included:
#   slot width  17.7 mm              calipers
#   rib width   16.3 - 16.8 mm       micrometer, several ribs
#   pitch       34.0 - 34.5 mm       derived: slot + rib (nominal 34.25)
#
# Both readings include the powder coat. Nominal bare metal is roughly 0.1-0.2 mm
# narrower on the slot and wider on the rib, so the printed part must be sized off
# the coated numbers (the part touches the coating, not the metal).
#
# The reference clip's hook spacing is 32.90 mm, i.e. 1.1-1.6 mm under this pitch.
# Its arch span (16.8 mm) also equals the upper rib measurement exactly, leaving no
# margin for the skirt to enter the neighbouring slot. The ring arch is therefore
# widened rather than copied blind - see docs/quickmount-mechanism.md.

id: cinque_5_2
status: partial
envelope:
  width_mm: 622.0
  depth_mm: 424.0
sheets:
  # Measured 3.0 mm. RockBoard's catalogue specifies cold-rolled aluminium for the
  # whole range; the section feels dense but the material spec is aluminium.
  aluminium_mm: 3.0
  powder_coat_mm: 0.1
  # Clear vertical space below the sheet, i.e. from the sheet's underside down to
  # the first solid thing (U-brace) beneath a slot. The keeper ring hangs 19.64 mm
  # below the bar, so this must exceed that. Measure through a slot with the
  # caliper's depth rod, then subtract the sheet thickness.
  under_sheet_clearance_mm: 22.0
  brace_spacing_mm: null      # centre to centre; clips avoid brace lines if small
  brace_width_mm: null

slots:
  width_mm: 17.7
  rib_mm: 16.55          # nominal; range 16.3-16.8
  rib_min_mm: 16.3
  rib_max_mm: 16.8
  pitch_mm: 34.25        # nominal; range 34.0-34.5
  pitch_min_mm: 34.0
  pitch_max_mm: 34.5

field_status:
  slot_width:
    status: measured
    source: "callipers, inside jaws, 2026-11-02, powder coat included"
  rib_width:
    status: measured
    source: "micrometer, several ribs, 2026-11-02, powder coat included (16.3-16.8)"
  pitch:
    status: derived
    source: "slot width + rib width; measure directly across 4 slots to tighten"
  sheet_thickness:
    status: measured
    source: "micrometer, 3.0 mm sheet + 0.1 mm powder coat, 2026-11-02"
  under_sheet_clearance:
    status: assumed
    source: "estimate; must exceed the ring depth"
