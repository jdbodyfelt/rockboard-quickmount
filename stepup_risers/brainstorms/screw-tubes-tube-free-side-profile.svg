<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="60mm" viewBox="-75 -46 160 60">
  <style>
    text{font-family:Arial,sans-serif;fill:#1f2937}.title{font-size:5px;font-weight:bold}.label{font-size:3.5px}.small{font-size:2.7px}.datum{stroke:#15803d;stroke-width:.7}.drop{stroke:#64748b;stroke-width:.45;stroke-dasharray:2 1.5}.plate{fill:#e5e7eb;stroke:#111827;stroke-width:.7}.deck{stroke:#2563eb;stroke-width:.45;stroke-dasharray:1.5 1}.dim{stroke:#2563eb;stroke-width:.35;fill:none}.dimtext{font-size:3px;fill:#1d4ed8}
  </style>
  <!--
    True-scale Y-Z projection in millimetres.
    Source geometry: current tube-free placement from single_125b_riser.py,
    produced by removing the tubes from dwg/screw_tubes.stl's source state.
    Bottom corners: (-67.50, 20.00), (56.64, 38.39).
    Top corners:    (-67.94, 22.97), (56.20, 41.36).
  -->
  <text x="-72" y="-40" class="title">Tube-free single_125b_riser — true-scale side profile (Y–Z)</text>
  <text x="-72" y="-34" class="small">The saved screw_tubes STL is the source-state reference; tubes removed for this drawing.</text>

  <!-- z = 0 datum -->
  <path d="M-72 0 L80 0" class="datum"/>
  <text x="58" y="-2.5" class="label">z = 0 board plane</text>

  <!-- The current plate: SVG y is -Z -->
  <path d="M-67.50 -20.00 L56.64 -38.39 L56.20 -41.36 L-67.94 -22.97 Z" class="plate"/>

  <!-- Vertical droplines from all plate corners -->
  <path d="M-67.50 -20.00 L-67.50 0" class="drop"/>
  <path d="M56.64 -38.39 L56.64 0" class="drop"/>
  <path d="M-67.94 -22.97 L-67.94 0" class="drop"/>
  <path d="M56.20 -41.36 L56.20 0" class="drop"/>

  <!-- Reference deck: 20 mm at front, 40 mm at its 135 mm rear -->
  <path d="M-67.50 -20.00 L67.50 -40.00" class="deck"/>
  <text x="-20" y="-31" class="small">20 / 40 / 135 reference deck</text>

  <!-- Labels -->
  <text x="-64" y="-25" class="label">short end: 20.00</text>
  <text x="30" y="-43" class="label">top: 41.36</text>
  <text x="30" y="-35" class="label">plate bottom: 38.39</text>

  <!-- Plan projection and dimensions -->
  <path d="M-67.50 7 L56.64 7" class="dim"/>
  <path d="M-67.50 5.5 L-67.50 8.5 M56.64 5.5 L56.64 8.5" class="dim"/>
  <text x="-22" y="12" class="dimtext">124.14 projected bottom length</text>
  <text x="-72" y="18" class="small">Dashed lines are vertical droplines: suitable as the starting drawing for the next wedge sketch.</text>
</svg>
