<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <style>
    text{font-family:Arial,sans-serif;fill:#1f2937}.title{font-size:27px;font-weight:bold}.label{font-size:18px}.small{font-size:15px}.dim{font-size:16px;fill:#1d4ed8}.board{fill:#dcfce7;stroke:#15803d;stroke-width:3}.wedge{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.skin{stroke:#374151;stroke-width:7}.enclosure{fill:#e5e7eb;stroke:#374151;stroke-width:3}.clip{fill:#fed7aa;stroke:#c2410c;stroke-width:3}.dimline{stroke:#2563eb;stroke-width:2;fill:none;marker-start:url(#start);marker-end:url(#end)}.dash{stroke:#6b7280;stroke-width:2;stroke-dasharray:8 6;fill:none}
  </style>
  <defs>
    <marker id="end" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker>
    <marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto"><path d="M7,0 L7,6 L0,3 z" fill="#2563eb"/></marker>
  </defs>
  <text x="42" y="43" class="title">Single-125B riser: overall side profile (concept)</text>
  <text x="42" y="72" class="label">Not to scale — preserves the current 20 / 40 / 135 mm reference geometry</text>

  <!-- Board and lower clips -->
  <path d="M70 466 L900 466 L900 505 L70 505 Z" class="board"/>
  <text x="760" y="535" class="label">RockBoard top plane</text>
  <path d="M260 466 L260 493 L292 493 L292 458" class="clip"/>
  <path d="M688 466 L688 493 L720 493 L720 458" class="clip"/>
  <text x="92" y="445" class="small">riser's own board clips</text>

  <!-- Wedge and inclined top -->
  <path d="M230 465 L750 465 L705 255 L300 362 Z" class="wedge"/>
  <path d="M300 362 L705 255" class="skin"/>
  <text x="452" y="412" class="label">printed wedge</text>
  <text x="463" y="435" class="small">future sparse / honeycomb backfill</text>

  <!-- Adapter deck -->
  <path d="M297 360 L708 252" class="skin"/>
  <text x="536" y="235" class="small">top adapter deck / capture interface</text>

  <!-- Enclosure plate and body -->
  <path d="M326 320 L677 227 L693 287 L342 380 Z" class="enclosure"/>
  <path d="M360 315 L388 307 L388 333 L415 326" class="clip"/>
  <path d="M615 247 L643 240 L643 266 L670 259" class="clip"/>
  <text x="507" y="158" class="label">regular single_125b_enclosure</text>
  <text x="507" y="181" class="small">includes its normal B1 clips</text>
  <text x="442" y="298" class="small">enclosure plate</text>

  <!-- Geometry dimensions -->
  <path d="M300 362 L300 466" class="dash"/>
  <path d="M705 255 L705 466" class="dash"/>
  <path d="M270 362 L270 466" class="dimline"/>
  <text x="140" y="420" class="dim">20 mm at short end</text>
  <path d="M774 255 L774 466" class="dimline"/>
  <text x="784" y="365" class="dim">40 mm at tall end</text>
  <path d="M300 525 L705 525" class="dimline"/>
  <text x="452" y="550" class="dim">135 mm reference deck span</text>

  <!-- Direction / explanation -->
  <path d="M328 399 L672 307" class="dash"/>
  <text x="83" y="118" class="label">Top attachment remains open:</text>
  <text x="83" y="144" class="small">A. B1 clips into an adapter deck (preferred)</text>
  <text x="83" y="167" class="small">B. horizontal key slot + side hex lock</text>
  <text x="83" y="190" class="small">C. side-entry dovetail + latch</text>
  <text x="83" y="213" class="small">D. shallow captive screw pocket</text>
</svg>
