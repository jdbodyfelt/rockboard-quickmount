<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
  <style>text{font-family:Arial,sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:bold}.label{font-size:17px}.small{font-size:14px}.line{stroke:#1f2937;stroke-width:3;fill:none}.wedge{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.plate{fill:#e5e7eb;stroke:#374151;stroke-width:3}.hardware{fill:#fde68a;stroke:#a16207;stroke-width:3}.cut{fill:#fff;stroke:#1f2937;stroke-width:2}.arrow{stroke:#7c3aed;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs>
  <text x="40" y="42" class="title">D. Shallow captive screw pockets</text>
  <text x="40" y="72" class="label">Side section — short hardware sits close to the top skin, reachable through side windows</text>
  <path d="M120 370 L780 370 L700 194 L200 194 Z" class="wedge"/>
  <path d="M220 194 L680 194 L667 166 L233 166 Z" class="plate"/>
  <text x="531" y="151" class="label">enclosure / top skin</text>
  <path d="M408 166 L408 247" class="line"/>
  <path d="M392 234 l16 -12 l16 12 l0 18 l-16 12 l-16 -12 z" class="hardware"/>
  <text x="430" y="259" class="small">captive nut</text>
  <path d="M407 105 L407 160" class="arrow"/>
  <text x="420" y="116" class="small">short screw</text>
  <path d="M700 248 L760 248" class="cut"/>
  <text x="670" y="281" class="small">side access window</text>
  <text x="133" y="416" class="label">Keeps fasteners shallow, but installation order and access windows must be designed carefully.</text>
</svg>
