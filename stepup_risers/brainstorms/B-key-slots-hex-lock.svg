<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
  <style>text{font-family:Arial,sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:bold}.label{font-size:17px}.small{font-size:14px}.line{stroke:#1f2937;stroke-width:3;fill:none}.wedge{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.plate{fill:#e5e7eb;stroke:#374151;stroke-width:3}.hardware{fill:#fde68a;stroke:#a16207;stroke-width:3}.cut{fill:#fff;stroke:#1f2937;stroke-width:2}.arrow{stroke:#7c3aed;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker></defs>
  <text x="40" y="42" class="title">B. Horizontal key slots with a captive hex lock</text>
